# Render Blueprint for Aurum backend (Django + DRF)
# Deploy this via New Blueprint → select ken-muritu/aurum → branch main → render.yaml
services:
  - type: web
    name: aurum
    runtime: python
    region: oregon          # or frankfurt / singapore
    plan: free             # upgrade to starter for persistent DB + no sleep
    branch: main
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py migrate --noinput
    startCommand: gunicorn aurum.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /api/discover/
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: aurum-db
          property: connectionString
      - key: CORS_ALLOW_ALL
        value: "True"          # permissive for MVP; tighten via AURUM_CORS later
      - key: AURUM_CORS
        value: "https://aurumio.vercel.app,https://aurum.io"
      - key: YOUTUBE_API_KEY
        sync: false           # paste your YouTube Data API v3 key here
      - key: OPENAI_API_KEY
        sync: false           # optional: Phase 2 AI summary (graceful no-op if unset)
      - key: BREVO_API_KEY
        sync: false           # paste your Brevo API key (password reset emails)
      - key: BREVO_FROM
        sync: false           # e.g. "Aurum <you@yourdomain.com>", a sender verified in Brevo

databases:
  - name: aurum-db
    databaseName: aurum
    plan: free
